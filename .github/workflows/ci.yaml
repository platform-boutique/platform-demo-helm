name: CI

# Pull-request gate for the charts. Nothing runs on a plain push.
#
# TWO LANES, chosen by the first job, `classify` (.github/scripts/classify-change.py, tested by test-classify-change.py):
#
#   image-only  the pull request changes exactly ONE envs/<env>/values/<app>.yaml and in it nothing but the image.tag / image.digest /
#               `# vX.Y.Z` lines: the automation's image bump (branch promote/<app>/<env> or rollback/<app>/<env>). The charts, schemas,
#               policies and workflows cannot have changed, so the render, kubeconform, Trivy, Kyverno and workflow-lint jobs are
#               SKIPPED. Still run: the promotion policy (with its self-tests), the secret scan and the Cosign check of the changed
#               digest(s) only (verify-signatures.sh --images).
#   full        everything else (a chart, a policy, a script, a workflow, docs, common.yaml, a new or deleted values file, any other
#               line, more than one file, ANY doubt or error of the classifier, a manual run): every job runs, the Cosign check
#               verifies every image of every environment as before.
#
#   job                 image-only   full
#   classify            runs         runs
#   promotion-policy    runs         runs   (skipped on a manual run: it needs a pull request)
#   secret-scan         runs         runs
#   verify-signatures   changed only every image
#   lint-and-render     skipped      runs
#   kubeconform         skipped      runs
#   trivy-config        skipped      runs
#   kyverno-policies    skipped      runs
#   workflows           skipped      runs
#
# Why the lane is decided INSIDE the workflow and not with `on.pull_request.paths`: when a whole workflow is skipped by a path filter its
# checks stay "Pending" and block the merge forever, while a JOB skipped by an `if:` reports "Success" and so passes a required check.
# Neither is a gate. Here the workflow always runs, `gate` always runs, and `gate` knows the expected result of every job PER LANE
# (GitHub docs: "Troubleshooting required status checks" -> "Handling skipped but required checks"; "Using conditions to control job
# execution"). A job that was skipped when the lane says it must run, a full-lane job that ran in the fast lane (the classifier output
# was ignored), a failed or missing `classify`, or a lane value that is neither `image-only` nor `full` all fail the gate.
#
# `gate` is the ONE required status check of the branch protection. It fails when any job failed, was cancelled, or has a result that
# the lane does not expect (a job downstream of a failed `lint-and-render` is skipped by GitHub, which a required check would otherwise
# treat as a pass). Rules: the `gate` job at the end; test: .github/scripts/test-gate.py. No `merge_group` trigger (not used).
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  HELM_VERSION: v3.22.0
  KUBECONFORM_VERSION: v0.8.0
  KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
  COSIGN_VERSION: v3.1.3
  KYVERNO_VERSION: v1.19.1
  KYVERNO_SHA256: b38228f367fc0fdc2b08f4c83ea50ac5f16c60ff8d62d76a66157c33c47b70ae
  KUBERNETES_VERSION: 1.33.0

jobs:
  # ─── which lane? ──────────────────────────────────────────────────────────

  # Needs only a checkout with the whole history (the merge base) and no credentials. Always exits 0 with a lane; whatever it cannot
  # prove to be an image pin is `full`. The script runs from the pull request's own checkout, like every other script of this workflow:
  # a pull request that changes it (or this file) is `full` anyway, and changing the workflow files is what review and CODEOWNERS are for.
  classify:
    name: Classify the change
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      lane: ${{ steps.classify.outputs.lane }} # image-only | full
      images: ${{ steps.classify.outputs.images }} # image-only: repository@digest of the pinned image(s), for the Cosign check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the merge base with the target branch
          persist-credentials: false

      - name: Image pin only, or everything
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: origin/${{ github.base_ref }}
          HEAD_REF: HEAD
        run: python3 .github/scripts/classify-change.py

  # ─── helm lint + render ───────────────────────────────────────────────────

  lint-and-render:
    name: Helm lint & render
    needs: [classify]
    if: needs.classify.outputs.lane == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build chart dependencies (file:// sub-charts)
        run: |
          # Every chart except the umbrella first, then the umbrella (it packages the others).
          for dir in */; do
            chart=${dir%/}
            [ -f "$chart/Chart.yaml" ] || continue
            case "$chart" in monitoring|platform-demo) continue ;; esac
            grep -q 'repository:' "$chart/Chart.yaml" && helm dependency build "$chart"
          done
          helm dependency build platform-demo

      - name: helm lint
        run: |
          status=0
          for dir in */; do
            chart=${dir%/}
            [ -f "$chart/Chart.yaml" ] || continue
            [ "$chart" = monitoring ] && continue # vendored upstream charts, not ours to lint
            args=()
            case "$chart" in
              product-catalog-db) args=(--set auth.password=x) ;;
              platform-demo) args=(--set product-catalog-db.auth.password=x) ;;
            esac
            echo "::group::helm lint $chart"
            helm lint "$chart" "${args[@]}" || status=1
            echo "::endgroup::"
          done
          exit $status

      - name: helm template (every configuration we ship)
        run: |
          mkdir -p rendered
          helm template platform-demo ./platform-demo -f platform-demo/values-dev.yaml > rendered/umbrella-dev.yaml
          helm template platform-demo ./platform-demo --set product-catalog-db.auth.password=x > rendered/umbrella-default.yaml
          helm template platform-demo ./platform-demo -f platform-demo/values-prod.yaml \
            --set product-catalog-db.auth.existingSecret=s > rendered/umbrella-prod.yaml
          helm template platform-gateway ./platform-gateway > rendered/gateway.yaml
          # Not an environment add-on (its own Argo CD Application, project `secrets`): rendered here so kubeconform checks the ExternalSecrets.
          helm template external-secrets-config ./external-secrets-config > rendered/external-secrets-config.yaml
          # Every workload and add-on of every environment, rendered the way the ApplicationSets do (plus the layers'
          # single-chart Applications: cluster-bootstrap, platform-network-policies). Fails when an app's namespace is undeclared.
          python3 .github/scripts/render-envs.py rendered
          wc -l rendered/*.yaml

      # The app dropdowns of the Promote and Rollback workflows list the workloads that have an image; a new service must be added there.
      - name: Check the dispatch dropdowns
        run: python3 .github/scripts/check-dispatch-apps.py

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rendered
          path: rendered/
          retention-days: 7

  # ─── schema validation ────────────────────────────────────────────────────

  kubeconform:
    name: kubeconform
    runs-on: ubuntu-latest
    needs: [classify, lint-and-render]
    if: needs.classify.outputs.lane == 'full'
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rendered
          path: rendered

      - name: Install kubeconform
        run: |
          curl -fsSL -o kubeconform.tgz "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform.tgz" | sha256sum -c -
          tar -xzf kubeconform.tgz kubeconform

      - name: Validate rendered manifests against the Kubernetes and CRD schemas
        run: |
          ./kubeconform -strict -summary -kubernetes-version "$KUBERNETES_VERSION" \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            rendered/*.yaml gitops/apps/*.yaml gitops/bootstrap/*.yaml gitops/layers/*/*.yaml

  # ─── misconfiguration scan ────────────────────────────────────────────────

  trivy-config:
    name: Trivy config scan
    runs-on: ubuntu-latest
    needs: [classify, lint-and-render]
    if: needs.classify.outputs.lane == 'full'
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rendered
          path: rendered

      # The charts that deploy must be clean (HIGH/CRITICAL fail the build). Accepted findings, each with its reason:
      # .trivyignore.yaml.
      - name: Trivy config - application and gateway charts
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: rendered
          trivyignores: .trivyignore.yaml
          severity: HIGH,CRITICAL
          exit-code: 1
          format: table

  # ─── promotion gate ───────────────────────────────────────────────────────

  # Runs in BOTH lanes. Fast lane: only the digest(s) the pull request pins (nothing else changed since the last full run, and every
  # other image was verified when it was merged). Full lane: every image in the rendered charts, as before, so it waits for the render.
  # The `if` is the usual "needs a job that may be skipped" form: GitHub skips a job whose needed job was skipped unless the `if`
  # contains a status function; it names exactly the two cases in which this job must run, and `gate` checks that it did.
  verify-signatures:
    name: Cosign verify images
    runs-on: ubuntu-latest
    needs: [classify, lint-and-render]
    if: ${{ !cancelled() && needs.classify.result == 'success' && (needs.classify.outputs.lane == 'image-only' || needs.lint-and-render.result == 'success') }}
    timeout-minutes: 20 # 5 tries with backoff per image in the worst case (a registry outage)
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.classify.outputs.lane == 'full'
        with:
          name: rendered
          path: rendered

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      # The retry and classification logic is tested with a fake cosign (no network).
      - name: Self-test of the verification script and of the signer list
        run: |
          .github/scripts/test-verify-signatures.sh
          python3 .github/scripts/signer-identities.py test

      # Hosted runners share IP addresses, so anonymous Docker Hub lookups hit the pull limit. The token is READ-ONLY. Fork and Dependabot
      # pull requests get no secrets: the lookups then run anonymously (and the retries absorb most limit errors).
      - name: Log in to Docker Hub (read-only token)
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::warning::no Docker Hub credentials in this run (fork or Dependabot pull request?): verifying anonymously"
            exit 0
          fi
          printf '%s' "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin \
            || echo "::warning::Docker Hub login failed (expired token?): verifying anonymously"

      # Every image of ours that the charts deploy must be pinned by digest and signed (keyless) by one of the workflows listed in
      # verifyImages.signers (policies/values.yaml: the same list the Kyverno policy enforces; each entry says why it exists and
      # when it can go). Anything pushed by hand fails the promotion. "No signature" is a verdict and is never retried; registry
      # errors (rate limit, 5xx, timeouts) are retried 5 times with backoff, and if they persist the job says so and fails.
      - name: Verify digests and signatures
        env:
          # product-catalog-db is a hand-built, unsigned image that stays a StatefulSet in the cluster for now (the shop moves to
          # another cluster later); this entry goes away if it is ever replaced by a signed image. Do not add other images here.
          UNSIGNED_ALLOWLIST: product-catalog-db
          LANE: ${{ needs.classify.outputs.lane }}
          IMAGES: ${{ needs.classify.outputs.images }}
        run: |
          case "$LANE" in
            image-only) .github/scripts/verify-signatures.sh --images "$IMAGES" ;; # only what this pull request pins
            full) .github/scripts/verify-signatures.sh rendered ;;                 # every image of every environment
            *) echo "::error::lane '$LANE' is neither image-only nor full"; exit 1 ;;
          esac

  # ─── admission policies ───────────────────────────────────────────────────

  kyverno-policies:
    name: Kyverno policy tests
    runs-on: ubuntu-latest
    # Waits only for `classify` (seconds): it builds the dependencies and renders the environments itself and uses no artifact, so it
    # runs in parallel with the lint. (Sharing the render through an artifact was measured and is NOT cheaper: render-envs.py takes
    # about 5 s, an artifact upload plus download about as much, and the job would then wait for the whole lint job.)
    needs: [classify]
    if: needs.classify.outputs.lane == 'full'
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install the Kyverno CLI
        run: |
          curl -fsSL -o kyverno.tgz "https://github.com/kyverno/kyverno/releases/download/${KYVERNO_VERSION}/kyverno-cli_${KYVERNO_VERSION}_linux_x86_64.tar.gz"
          echo "${KYVERNO_SHA256}  kyverno.tgz" | sha256sum -c -
          tar -xzf kyverno.tgz kyverno
          sudo install -m 0755 kyverno /usr/local/bin/kyverno

      - name: Build chart dependencies (file:// sub-charts)
        run: |
          for dir in */; do
            chart=${dir%/}
            [ -f "$chart/Chart.yaml" ] || continue
            case "$chart" in monitoring|platform-demo) continue ;; esac
            grep -q 'repository:' "$chart/Chart.yaml" && helm dependency build "$chart"
          done

      # Unit tests for the policies (policies/tests), then every rendered workload and add-on of every environment is evaluated
      # against them, so a chart change that admission would refuse fails here and not at sync time.
      - name: Render environments and run the policy checks
        run: |
          python3 .github/scripts/render-envs.py rendered
          .github/scripts/policy-check.sh rendered

  # ─── promotion policy ─────────────────────────────────────────────────────

  # Which image changes a pull request may make (dev: any signed digest; stage: what dev has now or what stage had before;
  # prod: the same with stage; one environment per pull request, nothing else mixed in). Rules: .github/scripts/promotion-policy.sh.
  promotion-policy:
    name: Promotion policy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read # to read the labels at run time (re-run the job after adding a label)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the policy reads the history of the base branch
          persist-credentials: false

      - name: Self-test of the policy
        run: .github/scripts/test-promotion-policy.sh

      - name: Self-test of the promotion planning (promote.sh)
        run: .github/scripts/test-promote.sh

      # Runs in both lanes: the classifier decides which checks a pull request gets, so its own test is never skipped.
      - name: Self-test of the lane classifier
        run: python3 .github/scripts/test-classify-change.py

      - name: Check the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: origin/${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          LABELS=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels" --jq '[.[].name] | join(",")')
          export LABELS
          .github/scripts/promotion-policy.sh

  # ─── repo hygiene ─────────────────────────────────────────────────────────

  secret-scan:
    permissions:
      contents: read
      pull-requests: read
    uses: platform-boutique/platform-demo-workflows/.github/workflows/secret-scan.yaml@ee7562da9860ad2c824ce50e6d56c1f62f1d3515 # v3.3.0

  workflows:
    needs: [classify]
    if: needs.classify.outputs.lane == 'full'
    permissions:
      contents: read
    uses: platform-boutique/platform-demo-workflows/.github/workflows/workflow-lint.yaml@28d80c1d4abd81c1529bf593a874640132692e8a # v2.0.2

  # ─── the one required check ───────────────────────────────────────────────

  # The ONLY required status check of the branch protection (name: `gate`). Waits for every other job and runs even when they fail
  # (`always()`). It knows the expected result of every job PER LANE (`classify` output `lane`, read from `needs`):
  #   image-only  the full-lane-only jobs must be `skipped`; a `success` there means the lane was ignored, and fails
  #   full        every job must be `success`; a skipped job fails (a required check would count it as a pass)
  # and it fails on a failed, cancelled or missing `classify`, and on a lane that is neither `image-only` nor `full`. A job that GitHub
  # skipped because something upstream failed (everything behind `lint-and-render`) is a consequence: the failed job is reported, first.
  # The only legitimate skip in the full lane: `Promotion policy` on a manual run (it needs a pull request); a manual run is always full.
  # Add a job to this workflow => add it to `needs` here AND to the lists in the script; .github/scripts/test-gate.py fails otherwise.
  gate:
    name: gate
    needs: [classify, lint-and-render, kubeconform, trivy-config, verify-signatures, kyverno-policies, promotion-policy, secret-scan, workflows]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github
          persist-credentials: false

      - name: Self-test of the gate (both lanes, failed, cancelled, unexpected skip, ignored lane, missing job, ...)
        run: python3 .github/scripts/test-gate.py

      - name: Every job has the result its lane expects
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # Jobs this workflow has, besides the gate. NEEDS holds the result of every one of them.
          jobs=(classify lint-and-render kubeconform trivy-config verify-signatures kyverno-policies promotion-policy secret-scan workflows)
          # The jobs that exist only in the full lane: skipped in the image-only lane, success in the full lane.
          full_only=(lint-and-render kubeconform trivy-config kyverno-policies workflows)

          declare -A want
          for job in "${jobs[@]}"; do want[$job]=success; done
          case "$EVENT_NAME" in
            pull_request) ;;
            workflow_dispatch) want[promotion-policy]=skipped ;; # it needs a pull request to look at
            *) echo "::error::event '$EVENT_NAME' is not one this workflow is written for"; exit 1 ;;
          esac

          for job in "${jobs[@]}"; do
            jq -e --arg job "$job" 'has($job)' <<< "$NEEDS" > /dev/null || { echo "::error::job $job is missing from needs"; exit 1; }
          done

          # The lane. Only believed when classify succeeded; anything but the two known values is a problem of its own, and the
          # expectations then stay those of the full lane (the strict ones).
          lane=$(jq -r '.classify.outputs.lane // ""' <<< "$NEEDS")
          classify_result=$(jq -r '.classify.result' <<< "$NEEDS")
          lane_problem=""
          if [ "$classify_result" = success ]; then
            case "$lane" in
              full) ;;
              image-only)
                if [ "$EVENT_NAME" != pull_request ]; then
                  lane_problem="lane 'image-only' on a $EVENT_NAME run (only a pull request can be an image pin)"
                else
                  for job in "${full_only[@]}"; do want[$job]=skipped; done
                fi
                ;;
              *) lane_problem="classify succeeded but its lane is '$lane', which is neither image-only nor full" ;;
            esac
          else
            lane="(unknown: classify $classify_result)"
          fi

          # Failed and cancelled jobs first: they are the cause. Everything downstream of a failed job is skipped by GitHub, and
          # that skip is a consequence, not a finding, so it is not reported as one.
          mapfile -t rows < <(jq -r 'to_entries | sort_by(.value.result == "failure" or .value.result == "cancelled" | not) | .[] | [.key, .value.result] | @tsv' <<< "$NEEDS")
          failed=0
          unexplained=0
          {
            echo "### Gate ($EVENT_NAME, lane: $lane)"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          for row in "${rows[@]}"; do
            IFS=$'\t' read -r job result <<< "$row"
            case "$result" in
              failure | cancelled)
                failed=1
                echo "::error::$job $result"
                echo "- **$job $result**" >> "$GITHUB_STEP_SUMMARY"
                ;;
            esac
          done
          if [ -n "$lane_problem" ]; then
            unexplained=1
            echo "::error::$lane_problem"
            echo "- **$lane_problem**" >> "$GITHUB_STEP_SUMMARY"
          fi

          {
            echo
            echo "| job | result | expected |"
            echo "|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          for row in "${rows[@]}"; do
            IFS=$'\t' read -r job result <<< "$row"
            expected=${want[$job]:-"(unknown job)"}
            printf '%-18s %-10s (expected %s)\n' "$job" "$result" "$expected"
            echo "| $job | $result | $expected |" >> "$GITHUB_STEP_SUMMARY"
            # Only when nothing failed: otherwise the failure above is the cause and skipped jobs downstream of it are expected.
            if [ "$failed" = 0 ] && [ "$result" != "$expected" ]; then
              if [ "$lane" = image-only ] && [ "$expected" = skipped ] && [ "$result" = success ]; then
                echo "::error::$job ran in the image-only lane (expected 'skipped'): the classifier output was ignored"
              else
                echo "::error::$job is '$result', expected '$expected' (lane: $lane)"
              fi
              unexplained=1
            fi
          done
          exit $((failed + unexplained))
